<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学園祭 Webサイト展示</title>
<style>
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{
    background:#F7FAF8;
    color:#1A2B4A;
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;line-height:1.6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
    border-top:10px solid;border-image:linear-gradient(90deg,#2B6CB0 50%,#1F7A4D 50%) 1;
  }
  .wrap{width:100%;max-width:1200px;padding:40px 28px 48px}
  header{text-align:center}
  .label{color:#44546F;font-weight:700;letter-spacing:.4em;font-size:17px}
  h1{margin:8px 0 0;font-size:clamp(30px,4.2vw,54px);line-height:1.3}
  main{
    display:grid;grid-template-columns:1fr 1fr;gap:24px;
    margin-top:36px;
  }
  a.card{
    display:flex;flex-direction:column;gap:22px;
    background:#fff;color:#1A2B4A;text-decoration:none;
    border-radius:14px;border-top:8px solid var(--accent);
    box-shadow:0 6px 20px rgba(26,43,74,.10);
    padding:28px 32px 32px;
    transition:transform .15s, box-shadow .15s;
  }
  a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 28px rgba(26,43,74,.18);outline:none}
  .flag{height:88px;display:flex;align-items:center}
  .flag svg{height:100%;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
  .group{color:var(--accent);font-weight:700;font-size:17px;letter-spacing:.1em}
  .name{font-weight:700;font-size:clamp(24px,2.8vw,36px);line-height:1.3;margin:2px 0 10px}
  .desc{font-size:18px;line-height:1.7;color:#44546F}
  .go{
    align-self:flex-start;margin-top:auto;border-radius:999px;
    background:var(--accent);color:#fff;font-weight:700;
    font-size:19px;padding:12px 28px;
  }
  @media (max-width:760px){ main{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="label">SCHOOL FESTIVAL</div>
    <h1>見たいサイトを選んでね</h1>
  </header>
  <main id="cards"></main>
</div>

<script>
/* 国旗（そのまま・変更しなくてOK） */
const FLAGS = {
  nepal: `<svg role="img" aria-label="ネパールの国旗" viewBox="-4 -20 410 520" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1.0432 0 0 1.0432 -.0024051 -21.45)"><path d="m6.2712 489.83 363.1-0.01-237.66-241.01 246.61 0.29-372.03-237.62-0.0188 478.35z" fill="#DC143C" stroke="#003893" stroke-width="12.431" stroke-linejoin="miter" fill-rule="evenodd"></path><path d="m 296.97868,523.24292 -21.02922,7.1358 16.4532,15.86944 -22.15922,-1.45491 9.1278,20.95781 -19.91568,-9.82413 0.41278,22.85555 -14.64016,-16.69771 -8.36508,21.27374 -7.1358,-21.02923 -15.86944,16.4532 1.45491,-22.15922 -20.95781,9.1278 9.82413,-19.91568 -22.85555,0.41278 16.69771,-14.64016 -21.27374,-8.36508 21.02922,-7.1358 -16.45319,-15.86944 22.15922,1.45491 -9.1278,-20.95781 19.91568,9.82413 -0.41278,-22.85555 14.64016,16.69771 8.36508,-21.27374 7.1358,21.02923 15.86944,-16.4532 -1.45492,22.15922 20.95782,-9.1278 -9.82413,19.91568 22.85555,-0.41278 -16.69772,14.64016 z" transform="matrix(1.2301 0 0 1.1997 -192.06 -266.1)" fill="#FFFFFF" fill-rule="evenodd"></path><path d="m142.18 184.6-10.861 8.04 5.353 4.423c13-10.048 22.25-19.231 29.48-34.471 1.695 20.342-16.951 66.004-65.884 66.508-52.371-0.044-70.543-48.492-68.522-67.366 9.621 17.455 15.492 25.966 30.594 35.054l4.6206-4.241-10.229-8.523 13.168-3.424-7.0846-11.924 13.796 1.005-1.7336-13.885 12.094 7.077 3.784-12.926 8.6895 10.411 8.1403-9.87 4.432 13.411 11.301-7.864-1.449 13.639 13.548-1.59-6.351 12.608 13.115 3.908z" fill="#FFFFFF" fill-rule="evenodd"></path></g></svg>`,
  bangladesh: `<svg role="img" aria-label="バングラデシュの国旗" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="120" fill="#006A4E"></rect><circle cx="90" cy="60" r="30" fill="#F42A41"></circle></svg>`
};

/* ============================================================
   ここだけ書きかえてください！ (Edit ONLY this part)
   各グループの「グループ名」「サイトの名前」「説明」「URL」
   ============================================================ */
const sites = [
  {
    group: "Group M",
    accent: "#2B6CB0",                 // サイトの色（青）
    flag: "nepal",
    name:  "ネパール観光ガイド",
    desc:  "トレッキング・文化・野生動物サファリ。ネパールの旅を見つけよう。",
    url:   "https://skxm10.github.io/ProjectNepal/"
  },
  {
    group: "Group L",                         // ← 相手のグループ名
    accent: "#1F7A4D",                        // ← サイトの色（緑）
    flag: "bangladesh",
    name:  "Explore Bangladesh",                  // ← サイトの名前
    desc:  "バングラデシュの美しい観光地、文化、自然、食べ物を楽しみましょう。",  // ← 短い説明
    url:   "https://rana1539.github.io/JOY-BANGLA/"   // ← 相手のサイトのURL
  }
];
/* ============================================================ */

const root = document.getElementById("cards");
sites.forEach(s => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = s.url;
  // 同じタブで開く → 各サイトの「メニューに戻る」ボタンでこのページに戻れる
  a.style.setProperty("--accent", s.accent);
  const top = document.createElement("div");
  const f = document.createElement("div"); f.className = "flag"; f.innerHTML = FLAGS[s.flag] || "";
  const g = document.createElement("div"); g.className = "group"; g.textContent = s.group;
  const n = document.createElement("div"); n.className = "name";  n.textContent = s.name;
  const d = document.createElement("div"); d.className = "desc";  d.textContent = s.desc;
  top.append(f, g, n, d); top.style.flex = "1";
  const go = document.createElement("div"); go.className = "go"; go.textContent = "サイトを見る →";
  a.append(top, go);
  root.append(a);
});
</script>
</body>
</html>
